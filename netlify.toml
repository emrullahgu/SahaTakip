# =============================================================
# Netlify yapılandırması — SahaTakip Web Sürümü
# =============================================================

[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # EXPO_PUBLIC_* değişkenleri bilerek client bundle'a gömülür.
  # Supabase anon key public'tir (RLS ile korunur). Google Maps key
  # Google Cloud Console'da Android paketi + HTTP referrer ile kısıtlanır.
  EXPO_PUBLIC_SUPABASE_URL = "https://mdwcasycfssdkogdlbyh.supabase.co"
  EXPO_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_U-ETT9DDji_bbzYMd3KABQ_ENfXfGYa"
  EXPO_PUBLIC_GOOGLE_MAPS_API_KEY = "AIzaSyCK07v1Y92w9-x56uyUSSsYEHszNof1deE"
  # app.json / eas.json mobil derleme yapılandırması içindir; web build'in parçası değildir.
  SECRETS_SCAN_OMIT_KEYS = "EXPO_PUBLIC_GOOGLE_MAPS_API_KEY,EXPO_PUBLIC_SUPABASE_URL,EXPO_PUBLIC_SUPABASE_ANON_KEY"
  SECRETS_SCAN_OMIT_PATHS = "app.json,eas.json"

# SPA fallback — React Navigation history için
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Güvenlik başlıkları
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-XSS-Protection = "1; mode=block"

# Static cache — assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
