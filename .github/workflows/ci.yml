name: CI (typecheck + test)

# Her push ve PR'da TypeScript tip kontrolu + Jest testlerini calistirir.
# Onceki durumda testler CI'da HIC kosmuyordu (yalniz workflow_dispatch APK build vardi),
# bu yuzden bir regresyon merge'lenebiliyordu. Bu workflow guvenlik agini PR'a baglar.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20 kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bagimliliklar (npm ci)
        run: npm ci

      - name: TypeScript tip kontrolu
        run: npx tsc --noEmit

      - name: Jest testleri (pure-logic)
        run: npx jest --ci

      - name: Ekran smoke-render testleri
        run: npx jest --ci --config jest.render.config.js
